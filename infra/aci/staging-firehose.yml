# Reference configuration for nihdevgithubportalfh (staging firehose)
# Deployed by .github/workflows/staging_nihdevgithubportalfh.yml
# Do not deploy this file directly — secrets must come from GitHub Secrets.
#
# GitHub Secrets required for deployment:
#   DEV_REGISTRY_PASS               ACR password
#   DEV_REDIS_KEY                   Redis access key
#   DEV_POSTGRES_PASSWORD           Postgres password
#   DEV_SERVICEBUS_CONNECTIONSTRING Full Service Bus connection string
apiVersion: '2021-09-01'
location: centralus
name: nihdevgithubportalfh
properties:
  containers:
    - name: nihdevgithubportalfh
      properties:
        command:
          - node
          - /usr/src/repos/jobs/firehose.js
        environmentVariables:
          - name: REDIS_TLS_HOST
            value: <DEV_REDIS_TLS_HOST>
          - name: REDIS_PORT
            value: '6380'
          - name: REPOS_POSTGRES_DATABASE
            value: <DEV_POSTGRES_DB>
          - name: REPOS_POSTGRES_HOST
            value: <DEV_POSTGRES_HOST>
          - name: REPOS_POSTGRES_USER
            value: <DEV_POSTGRES_USER>
          - name: REPOS_POSTGRES_SSL
            value: 'false'
          - name: GITHUB_ORGANIZATIONS_FILE
            value: ../env-orgs.json
          - name: GITHUB_ORGANIZATIONS_SOURCE
            value: postgres
          - name: GITHUB_WEBHOOKS_PROVIDER
            value: servicebus
          - name: GITHUB_WEBHOOKS_SERVICEBUS_QUEUE
            value: events
          - name: REDIS_KEY
            secureValue: <DEV_REDIS_KEY>
          - name: REPOS_POSTGRES_PASSWORD
            secureValue: <DEV_POSTGRES_PASSWORD>
          - name: GITHUB_WEBHOOKS_SERVICEBUS_CONNECTIONSTRING
            secureValue: <DEV_SERVICEBUS_CONNECTIONSTRING>
        image: <DEV_REGISTRY_SERVER>/portal:latest
        ports:
          - port: 443
            protocol: TCP
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 1.5
  imageRegistryCredentials:
    - server: <DEV_REGISTRY_SERVER>
      username: <DEV_REGISTRY_USER>
      password: <DEV_REGISTRY_PASS>
  initContainers: []
  ipAddress:
    ports:
      - port: 443
        protocol: TCP
    type: Public
  osType: Linux
  restartPolicy: OnFailure
  sku: Standard
tags:
  Creator: petersonjd@nih.gov
  Customer: NIH
  Impact: Low
  Project: GitHub
