# Reference configuration for nihdevgithubportalcb (staging cache builder)
# Deployed by .github/workflows/staging_nihdevgithubportalcb.yml
# Do not deploy this file directly — secrets must come from GitHub Secrets.
#
# GitHub Secrets required for deployment:
#   DEV_REGISTRY_PASS               ACR password
#   DEV_REDIS_KEY                   Redis access key
#   DEV_POSTGRES_PASSWORD           Postgres password for citcs user
#   DEV_GITHUB_APP_OPERATIONS_KEY   GitHub App private key (PEM)
apiVersion: '2021-09-01'
location: centralus
name: nihdevgithubportalcb
properties:
  containers:
    - name: nihdevgithubportalcb
      properties:
        command:
          - node
          - /usr/src/repos/jobs/refreshQueryCache.js
        environmentVariables:
          - name: REDIS_TLS_HOST
            value: <DEV_REDIS_TLS_HOST>
          - name: REDIS_PORT
            value: '6380'
          - name: REPOS_POSTGRES_DATABASE
            value: <DEV_POSTGRES_DB>
          - name: REPOS_POSTGRES_HOST
            value: <DEV_POSTGRES_HOST>
          - name: REPOS_POSTGRES_USER
            value: <DEV_POSTGRES_USER>
          - name: REPOS_POSTGRES_SSL
            value: 'false'
          - name: GITHUB_ORGANIZATIONS_SOURCE
            value: postgres
          - name: GITHUB_APP_OPERATIONS_APP_ID
            value: <DEV_GITHUB_APP_OPERATIONS_APP_ID>
          - name: GITHUB_APP_OPERATIONS_SLUG
            value: <DEV_GITHUB_APP_OPERATIONS_SLUG>
          - name: REDIS_KEY
            secureValue: <DEV_REDIS_KEY>
          - name: REPOS_POSTGRES_PASSWORD
            secureValue: <DEV_POSTGRES_PASSWORD>
          - name: GITHUB_APP_OPERATIONS_KEY
            secureValue: <DEV_GITHUB_APP_OPERATIONS_KEY>
        image: <DEV_REGISTRY_SERVER>/portal:latest
        ports:
          - port: 443
            protocol: TCP
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 1.5
  imageRegistryCredentials:
    - server: <DEV_REGISTRY_SERVER>
      username: <DEV_REGISTRY_USER>
      password: <DEV_REGISTRY_PASS>
  initContainers: []
  ipAddress:
    ports:
      - port: 443
        protocol: TCP
    type: Public
  osType: Linux
  restartPolicy: OnFailure
  sku: Standard
tags:
  Creator: petersonjd@nih.gov
  Customer: NIH
  Impact: Low
  Project: GitHub
