name: NIH GHMP (Prod) - Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/prod/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.PROD_AAD_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.PROD_AAD_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.PROD_AAD_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.PROD_AAD_CLIENT_ID }}
          tenant-id: ${{ secrets.PROD_AAD_TENANT_ID }}
          subscription-id: ${{ secrets.PROD_AAD_SUBSCRIPTION_ID }}

      - name: Bootstrap Terraform backend storage
        env:
          TF_SA: ${{ secrets.PROD_TF_STORAGE_ACCOUNT }}
          TF_CONTAINER: ${{ vars.PROD_TF_STORAGE_CONTAINER }}
          RG: ${{ secrets.PROD_RG }}
        run: |
          az storage account create \
            --name "$TF_SA" \
            --resource-group "$RG" \
            --sku Standard_LRS \
            --allow-blob-public-access false \
            --min-tls-version TLS1_2 \
            2>/dev/null || echo "Storage account already exists"
          az storage container create \
            --name "$TF_CONTAINER" \
            --account-name "$TF_SA" \
            --auth-mode login \
            2>/dev/null || echo "Container already exists"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform Init
        working-directory: infra/terraform/prod
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.PROD_RG }}" \
            -backend-config="storage_account_name=${{ secrets.PROD_TF_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.PROD_TF_STORAGE_CONTAINER }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        working-directory: infra/terraform/prod
        run: |
          terraform plan \
            -var="resource_group_name=${{ secrets.PROD_RG }}" \
            -var="servicebus_namespace_name=${{ vars.PROD_SERVICEBUS_NAMESPACE }}"

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        working-directory: infra/terraform/prod
        run: |
          terraform apply -auto-approve \
            -var="resource_group_name=${{ secrets.PROD_RG }}" \
            -var="servicebus_namespace_name=${{ vars.PROD_SERVICEBUS_NAMESPACE }}"

      # Log Analytics workspace ID and key are NOT stored as secrets.
      # ACI deploy workflows look them up at deploy time via az monitor.
