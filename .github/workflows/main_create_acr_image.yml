name: NIH GHMP Container (Prod) - Build & Register

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'jobs/**'
      - 'business/**'
      - 'lib/**'
      - 'config/**'
      - 'interfaces/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.PROD_AAD_CLIENT_ID }}
          tenant-id: ${{ secrets.PROD_AAD_TENANT_ID }}
          subscription-id: ${{ secrets.PROD_AAD_SUBSCRIPTION_ID }}
      - name: Login to ACR
        env:
          REGISTRY_SERVER: ${{ secrets.PROD_REGISTRY_SERVER }}
        run: az acr login --name "${REGISTRY_SERVER%%.*}"
      - run: |
          docker build . -t ${{ secrets.PROD_REGISTRY_SERVER }}/portal
          docker push ${{ secrets.PROD_REGISTRY_SERVER }}/portal
