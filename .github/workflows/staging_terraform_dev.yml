name: NIH GHMP (Dev) - Terraform

on:
  push:
    branches:
      - staging
    paths:
      - 'infra/terraform/dev/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AAD_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AAD_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AAD_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      # ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN are
      # injected automatically by the runner when id-token: write is set.
      # Terraform's azurerm provider reads them directly — no mapping needed.

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AAD_CLIENT_ID }}
          tenant-id: ${{ secrets.AAD_TENANT_ID }}
          subscription-id: ${{ secrets.AAD_SUBSCRIPTION_ID }}

      - name: Bootstrap Terraform backend storage
        env:
          TF_SA: ${{ secrets.DEV_TF_STORAGE_ACCOUNT }}
          TF_CONTAINER: ${{ secrets.DEV_TF_STORAGE_CONTAINER }}
          RG: ${{ secrets.DEV_RG }}
        run: |
          az storage account create \
            --name "$TF_SA" \
            --resource-group "$RG" \
            --sku Standard_LRS \
            --allow-blob-public-access false \
            --min-tls-version TLS1_2 \
            2>/dev/null || echo "Storage account already exists"
          az storage container create \
            --name "$TF_CONTAINER" \
            --account-name "$TF_SA" \
            --auth-mode login \
            2>/dev/null || echo "Container already exists"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        working-directory: infra/terraform/dev
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.DEV_RG }}" \
            -backend-config="storage_account_name=${{ secrets.DEV_TF_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.DEV_TF_STORAGE_CONTAINER }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        working-directory: infra/terraform/dev
        run: |
          terraform plan \
            -var="resource_group_name=${{ secrets.DEV_RG }}" \
            -var="servicebus_namespace_name=${{ secrets.DEV_SERVICEBUS_NAMESPACE }}"

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        working-directory: infra/terraform/dev
        run: |
          terraform apply -auto-approve \
            -var="resource_group_name=${{ secrets.DEV_RG }}" \
            -var="servicebus_namespace_name=${{ secrets.DEV_SERVICEBUS_NAMESPACE }}"

      # Log Analytics workspace ID and key are NOT stored as secrets.
      # ACI deploy workflows look them up at deploy time via az monitor.
