# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: NIH GHMP (Dev) - Build & Deploy

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - '.cspell.json'
      - '.config/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/prompts/**'
      - '.github/workflows/main_*.yml'
      - '.github/workflows/staging_nihdevgithubportalcb.yml'
      - '.github/workflows/staging_nihdevgithubportalfh.yml'
      - '.github/workflows/staging_terraform_dev.yml'
      - 'infra/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install all dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Build default-assets-package
        run: cd ./default-assets-package && bun install --frozen-lockfile --ignore-scripts && bun run build

      # Tests are already run by the "Lint & Test" CI workflow on every push.
      # Skipping here to avoid the duplicate ~2 min cost on every deploy.

      - name: Prune dev dependencies
        # Re-use the already-populated bun cache; this is a metadata-only
        # operation after the cache is warm — much faster than a cold install.
        run: rm -rf node_modules && bun install --frozen-lockfile --ignore-scripts --production

      - name: Strip dev artifacts from node_modules
        # .map and .d.ts files are only needed for compilation/debugging.
        # Removing them cuts node_modules from ~508 MB to ~300 MB.
        run: |
          find node_modules -name '*.map' -delete
          find node_modules -name '*.d.ts' -delete

      - name: Stamp build number into package.json
        # continuousDeployment.js reads GITHUB_RUN_NUMBER at startup to build the
        # version string (major.minor.runNumber), but that env var is only present
        # during the workflow run — not on the deployed App Service. Baking it into
        # package.json (matching the same placeholder as container.yml) makes the
        # displayed version reflect the actual GitHub Actions run number.
        run: |
          sed -i "s/__Build_BuildNumber__/${{ github.run_number }}/" package.json
          sed -i "s/__Build_BranchName__/${{ github.ref_name }}/" package.json
          sed -i "s/__Build_SourceVersion__/${{ github.sha }}/" package.json

      - name: Package application for deployment
        # Deployed with WEBSITE_RUN_FROM_PACKAGE=1: the zip is mounted
        # READ-ONLY and IMMUTABLE at /home/site/wwwroot on each cold start.
        # There is no persistent filesystem to accumulate stale files from
        # prior deployments — every release is an atomic, complete state.
        # This eliminates the entire class of "Kudu additive deploy leaves
        # stale nested node_modules behind" bugs that plagued earlier
        # deploys (e.g. the @azure/core-tracing createTracingClient crash).
        #
        # No node_modules.tar.gz needed — Oryx is bypassed entirely.
        # Required Azure App Service settings (configure once in portal):
        #   WEBSITE_RUN_FROM_PACKAGE=1
        #   SCM_DO_BUILD_DURING_DEPLOYMENT=false
        #   ENABLE_ORYX_BUILD=false
        # Startup Command: node /home/site/wwwroot/github-portal/dist/bin/www
        run: |
          mkdir -p /tmp/pkg/github-portal

          rsync -a --exclude='.git' --exclude='.github' \
            --exclude='test' --exclude='docs' \
            --exclude='default-assets-package/node_modules' \
            --exclude='default-assets-package/src' \
            . /tmp/pkg/github-portal/
          find /tmp/pkg/github-portal -name '*.test.ts' -delete
          find /tmp/pkg/github-portal -name '*.spec.ts' -delete

          cd /tmp/pkg && zip -qr /tmp/node-app.zip .
          ls -lah /tmp/node-app.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-app
          path: /tmp/node-app.zip
          compression-level: 0

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-app

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AAD_CLIENT_ID }}
          tenant-id: ${{ secrets.AAD_TENANT_ID }}
          subscription-id: ${{ secrets.AAD_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'nihdevgithubportal'
          slot-name: 'Production'
          package: node-app.zip
