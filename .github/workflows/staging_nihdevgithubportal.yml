# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: NIH GHMP (Dev) - Build & Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install all dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Build default-assets-package
        run: cd ./default-assets-package && bun install --frozen-lockfile --ignore-scripts && bun run build

      # Tests are already run by the "Lint & Test" CI workflow on every push.
      # Skipping here to avoid the duplicate ~2 min cost on every deploy.

      - name: Prune dev dependencies
        # Re-use the already-populated bun cache; this is a metadata-only
        # operation after the cache is warm — much faster than a cold install.
        run: rm -rf node_modules && bun install --frozen-lockfile --ignore-scripts --production

      - name: Strip dev artifacts from node_modules
        # .map and .d.ts files are only needed for compilation/debugging.
        # Removing them cuts node_modules from ~508 MB to ~300 MB.
        run: |
          find node_modules -name '*.map' -delete
          find node_modules -name '*.d.ts' -delete

      - name: Package application for deployment
        # Oryx's startup script always looks for node_modules.tar.gz at the
        # wwwroot root and extracts it to /node_modules, then symlinks
        # /home/site/wwwroot/node_modules → /node_modules before running the
        # app.  Shipping our own node_modules.tar.gz replaces the stale
        # Oryx-generated one so the correct package versions are always used.
        # github-portal/ contains source + dist but NOT node_modules (Oryx
        # provides them via the tar → symlink mechanism).
        run: |
          mkdir -p /tmp/pkg/github-portal

          # Copy app (source + compiled dist) — exclude node_modules; Oryx
          # will supply them from node_modules.tar.gz below.
          rsync -a --exclude='.git' --exclude='.github' \
            --exclude='node_modules' --exclude='test' --exclude='docs' \
            --exclude='default-assets-package/node_modules' \
            --exclude='default-assets-package/src' \
            . /tmp/pkg/github-portal/
          find /tmp/pkg/github-portal -name '*.test.ts' -delete
          find /tmp/pkg/github-portal -name '*.spec.ts' -delete

          # Build the node_modules.tar.gz that Oryx expects at wwwroot root.
          # Content is flat (node_modules/* at the root of the tar) so that
          # `tar -xzf node_modules.tar.gz -C /node_modules` unpacks correctly.
          tar -czf /tmp/pkg/node_modules.tar.gz -C node_modules .

          cd /tmp/pkg && zip -qr /tmp/node-app.zip .
          ls -lah /tmp/node-app.zip /tmp/pkg/node_modules.tar.gz

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-app
          path: /tmp/node-app.zip
          compression-level: 0

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: 'nihdevgithubportal'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_34824FEBDA0F4C8CACF5CB97111CBFFB }}
          package: node-app.zip
