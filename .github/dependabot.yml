version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: staging
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'bun - back-end'
  - package-ecosystem: bun
    directory: /default-assets-package
    target-branch: staging
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'bun - front-end'
  - package-ecosystem: github-actions
    target-branch: staging
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'actions'
  - package-ecosystem: 'docker'
    target-branch: staging
    directory: '/'
    schedule:
      interval: 'weekly'
